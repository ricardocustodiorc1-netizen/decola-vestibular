<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste isolado — Leo na questão</title><style>body{margin:0;background:#eaf0fa;font:16px system-ui;color:#152a56}header{padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}p{margin:0}button{padding:10px;min-height:44px;border:1px solid #9fb6de;border-radius:8px;background:white;color:#163e9b}iframe{display:block;width:390px;max-width:100%;height:844px;margin:auto;border:1px solid #b9c9e6}</style><header><strong>TESTE ISOLADO — respostas controladas, sem IA</strong><p>Armazenamento fictício em memória. Nenhuma chamada externa.</p><button data-width="360">360 px</button><button data-width="390">390 px</button><button data-width="1280">Desktop</button><button data-mode="success">Resposta de teste</button><button data-mode="error">Erro HTTP de teste</button><button data-mode="pending">Aguardar para testar fechamento</button><button id="clock">Avançar intervalo de teste</button></header><iframe id="student-preview" title="Piloto do Leo — ambiente de teste"></iframe><script>
(async()=>{
 const frame=document.querySelector('iframe');
 const setup=()=>{
  const data=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:k=>data.get(k)??null,setItem:(k,v)=>data.set(k,String(v)),removeItem:k=>data.delete(k)}});
  const now=Date.now.bind(Date);Date.now=()=>now()+Number(document.documentElement.dataset.leoClock||0);
  document.documentElement.dataset.leoTestMode='success';document.documentElement.dataset.leoRequests='[]';
  window.fetch=async(url,options)=>{
   if(url!=='https://professor-leo-api.ricardocustodio-rc1.workers.dev/chat')throw new Error('Rede bloqueada no teste');
   const requests=JSON.parse(document.documentElement.dataset.leoRequests);requests.push(JSON.parse(options.body));document.documentElement.dataset.leoRequests=JSON.stringify(requests);
   if(document.documentElement.dataset.leoTestMode==='pending')return new Promise((resolve,reject)=>{options.signal.addEventListener('abort',()=>reject(new DOMException('Cancelado','AbortError')),{once:true});});
   if(document.documentElement.dataset.leoTestMode==='error')return {ok:false,json:async()=>({error:'Falha HTTP controlada'})};
   return {ok:true,json:async()=>({answer:'RESPOSTA CONTROLADA DE TESTE — não é IA. O contexto desta questão foi recebido. Este texto serve apenas para validar a interface e o envio de perguntas complementares.'})};
  };
 };
 const html=await (await fetch('../demonstracao.html')).text();
 frame.srcdoc=html.replace('<head>','<head><script>('+setup.toString()+')();</'+'script>');
 document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>frame.style.width=b.dataset.width+'px');
 document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>frame.contentDocument.documentElement.dataset.leoTestMode=b.dataset.mode);
 document.querySelector('#clock').onclick=()=>{const root=frame.contentDocument.documentElement;root.dataset.leoClock=String(Number(root.dataset.leoClock||0)+15001);};
})().catch(error=>{document.querySelector('header').append(' Falha ao carregar fixture: '+error.message);});
</script></html>
